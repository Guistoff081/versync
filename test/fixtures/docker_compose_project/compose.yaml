services:
  db:
    image: postgres:18.1-alpine
  redis:
    image: redis:8.2
  no_tag:
    image: postgres
  built:
    build: .
  registry_no_tag:
    image: myregistry:5000/postgres
  registry_tag:
    image: myregistry:5000/postgres:18
  digest_only:
    image: postgres@sha256:deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
  tag_and_digest:
    image: postgres:16@sha256:deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
  interpolated_with_default:
    image: postgres:${POSTGRES_VERSION:-16}
  interpolated_plain:
    image: postgres:$POSTGRES_VERSION
